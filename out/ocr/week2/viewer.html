"id": "r004", "layer": "phien_am", "group": "phien_am", "bbox": [643, 498, 1336, 1199], "text": "5. Sâm si hạnh thái,\n6. Tả hữu lưu chi,\n7. Yểu điệu thục nữ,\n8. Ngộ mỵ cầu chi.\n9. Cầu chi bất đắc,\n10. Ngộ mỵ tư bặc.\n11. Du tai! Du tai!\n12. Triển chuyển phản trắc.", "source": "source_patch", "crop": "layout/images/phien_am/page-0040-r004.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "5. Sâm si hạnh thái,\n6. Tả hữu lưu chi,\n7. Yểu điệu thực nữ,\n8. Ngộ mỹ cầu chi.\n9. Cầu chi bất đắc,\n10. Ngộ mỹ tư bậc.\n11. Du tai! Du tai!\n12. Triển chuyển phản trắc.", "truncated": false}}}, {"id": "r005", "layer": "tieu_de", "group": "tieu_de", "bbox": [666, 1245, 949, 1317], "text": "Dịch nghĩa", "source": "source_patch", "crop": "layout/images/tieu_de/page-0040-r005.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "Dịch nghĩa", "truncated": false}}}, {"id": "r006", "layer": "dich_sat", "group": "dich_sat", "bbox": [214, 1331, 1309, 1399], "text": "5. Rau hạnh cộng dài cộng ngắn không đều nhau,", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r006.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "5. Rau hạnh cộng dài cộng ngắn không đều nhau,", "truncated": false}}}, {"id": "r007", "layer": "dich_sat", "group": "dich_sat", "bbox": [118, 1390, 1485, 1521], "text": "6. Phải thuận theo dòng nước sang bên tả bên hữu mà\nhái.", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r007.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "6. Phải thuận theo dòng nước sang bên tả bên hữu mà hái.", "truncated": false}}}, {"id": "r008", "layer": "dich_sat", "group": "dich_sat", "bbox": [212, 1516, 837, 1587], "text": "7. Người thục nữ u nhàn ấy", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r008.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "7. Người thục nữ u nhàn ấy", "truncated": false}}}, {"id": "r009", "layer": "dich_sat", "group": "dich_sat", "bbox": [209, 1576, 1232, 1657], "text": "8. Khi thức khi ngủ đều lo cầu cho được nàng.", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r009.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "8. Khi thức khi ngủ đều lo cầu cho được nàng.", "truncated": false}}}, {"id": "r010", "layer": "dich_sat", "group": "dich_sat", "bbox": [210, 1641, 826, 1719], "text": "9. Nếu cầu mà không được,", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r010.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "9. Nếu câu mà không được,", "truncated": false}}}, {"id": "r011", "layer": "dich_sat", "group": "dich_sat", "bbox": [212, 1712, 1106, 1783], "text": "10. Thì khi thức khi ngủ đều tưởng nhớ.", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r011.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "10. Thi khi thức khi ngủ đều tưởng nhớ.", "truncated": false}}}, {"id": "r012", "layer": "dich_sat", "group": "dich_sat", "bbox": [213, 1776, 1326, 1848], "text": "11. Tưởng nhớ xa xôi thay! Tưởng nhớ xa xôi thay!", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r012.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "11. Tưởng nhớ xa xôi thay! Tưởng nhớ xa xôi thay!", "truncated": false}}}, {"id": "r013", "layer": "dich_sat", "group": "dich_sat", "bbox": [213, 1842, 1348, 1912], "text": "12. Vua cứ lăn qua trở lại mãi nằm không yên giấc.", "source": "source_patch", "crop": "layout/images/dich_sat/page-0040-r013.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "12. Vua cứ lăn qua trở lại mãi nằm không yên giấc.", "truncated": false}}}, {"id": "r014", "layer": "tieu_de", "group": "tieu_de", "bbox": [693, 1956, 927, 2025], "text": "Dịch thơ", "source": "source_patch", "crop": "layout/images/tieu_de/page-0040-r014.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "Dịch thơ", "truncated": false}}}, {"id": "r015", "layer": "dich_tho", "group": "dich_tho", "bbox": [212, 2044, 985, 2176], "text": "So le rau hạnh lơ thơ.\nHái theo dòng nước ven bờ đôi bên.", "source": "source_patch", "crop": "layout/images/dich_tho/page-0040-r015.png", "corrected": true, "patch_file": "patches/ocr_vietnamese_page40.tsv", "ocr": {"qwen2.5-vl": {"text": "So le rau hạnh lơ thơ.\nHái theo dòng nước ven bờ đôi bên.", "truncated": false}}}, {"id": "r016", "layer": "so_trang", "group": "so_trang", "bbox": [666, 2189, 750, 2246], "text": "41", "source": "layout_hint", "crop": "layout/images/so_trang/page-0040-r016.png", "corrected": false, "patch_file": "", "ocr": {}}]}, {"page": 41, "image": "images/page-0041.png", "json": "pages/page-0041.json", "size": [1538, 2246], "regions": [{"id": "r001", "layer": "dich_tho", "group": "dich_tho", "bbox": [204, 155, 892, 223], "text": "U nhàn thực nữ chính chuyên.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r001.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "U nhàn thực nữ chính chuyên.", "truncated": false}}}, {"id": "r002", "layer": "dich_tho", "group": "dich_tho", "bbox": [202, 217, 1076, 288], "text": "Nhá khi thức ngủ triền miên chẳng rời.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r002.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Nhá khi thức ngủ triền miên chẳng rời.", "truncated": false}}}, {"id": "r003", "layer": "dich_tho", "group": "dich_tho", "bbox": [203, 280, 889, 351], "text": "Nếu câu mà chẳng được người.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r003.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Nếu câu mà chẳng được người.", "truncated": false}}}, {"id": "r004", "layer": "dich_tho", "group": "dich_tho", "bbox": [199, 340, 993, 418], "text": "Khi mơ khi tỉnh bồi hồi nhớ thương.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r004.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Khi mơ khi tỉnh bồi hồi nhớ thương.", "truncated": false}}}, {"id": "r005", "layer": "dich_tho", "group": "dich_tho", "bbox": [199, 408, 853, 481], "text": "Xa xôi trông nhớ đêm trường.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r005.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Xa xôi trông nhớ đêm trường.", "truncated": false}}}, {"id": "r006", "layer": "dich_tho", "group": "dich_tho", "bbox": [203, 472, 1108, 548], "text": "Chiếc thân trằn trọc trên giường nào yên.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0041-r006.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chiếc thân trằn trọc trên giường nào yên.", "truncated": false}}}, {"id": "r007", "layer": "tieu_de", "group": "tieu_de", "bbox": [538, 588, 1054, 663], "text": "Chú giải của Chu Hy", "source": "source_patch", "crop": "layout/images/tieu_de/page-0041-r007.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "Chú giải của Chu Hy", "truncated": false}}}, {"id": "r008", "layer": "chu_thich", "group": "chu_thich", "bbox": [108, 668, 1472, 1308], "text": "Chương này thuộc thể hứng 參差 sâm si, dáng dài ngắn không đồng đều nhau 荷 hạnh, rau tiếp dư, rễ mọc ở đáy nước, lá màu đỏ tía hình tròn, bề kính hơn một tắc, nổi trên mặt nước. 或左或右 hoặc tả hoặc hữu, vô định không thường, khi bên trái khi bên mặt, 流 lưu, thuận theo dòng nước mà hái lấy, 或寤或寐 hoặc ngọ hoặc mỵ, không lúc nào là không, khi thức khi ngủ đều nhớ đến nàng, 服 bậc, nhớ, 悠 du, dài, xa xôi 辗 triền, lăn nửa vòng, 轉 chuyển, lăn trọn vòng, 反 phản, lăn lại, 倒 trắc, lăn nghiêng. Đều là nói nằm không yên giấc.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0041-r008.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này thuộc thể hứng 參差 sâm si, dáng dài ngắn không đồng đều nhau 荷 hạnh, rau tiếp dư, rễ mọc ở đáy nước, lá màu đỏ tía hình tròn, bề kính hơn một tắc, nổi trên mặt nước. 或左或右 hoặc tả hoặc hữu, vô định không thường, khi bên trái khi bên mặt, 流 lưu, thuận theo dòng nước mà hái lấy, 或寤或寐 hoặc ngọ hoặc mỵ, không lúc nào là không, khi thức khi ngủ đều nhớ đến nàng, 服 bậc, nhớ, 悠 du, dài, xa xôi 辗 triền, lăn nửa vòng, 轉 chuyển, lăn trọn vòng, 反 phản, lăn lại, 倒 trắc, lăn nghiêng. Đều là nói nằm không yên giấc.", "truncated": false}}}, {"id": "r009", "layer": "chu_thich", "group": "chu_thich", "bbox": [113, 1295, 1472, 1770], "text": "Chương này nói vào lúc chưa cầu được nàng Thái Tự:\nRau hạnh cộng ngắn cộng dài không đều kia, phải thuận theo dòng nước sang bên tả sang bên hữu mà hái.\nNgười thực nữ yếu điệu ấy, khi thức khi ngủ vua không quên lo cầu cho được nàng, vì nàng ấy với đức hạnh ấy trên đời không thường có vậy.\nNếu cầu nàng mà không được thì không có ai phối hợp với vua để thành việc nội trị hoàn mỹ.\nCho nên vua lo nghĩ sâu xa không xiết đến thế ấy.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0041-r009.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này nói vào lúc chưa cầu được nàng Thái Tự:\nRau hạnh cộng ngắn cộng dài không đều kia, phải thuận theo dòng nước sang bên tả sang bên hữu mà hái.\nNgười thực nữ yếu điệu ấy, khi thức khi ngủ vua không quên lo cầu cho được nàng, vì nàng ấy với đức hạnh ấy trên đời không thường có vậy.\nNếu cầu nàng mà không được thì không có ai phối hợp với vua để thành việc nội trị hoàn mỹ.\nCho nên vua lo nghĩ sâu xa không xiết đến thế ấy.", "truncated": false thục nữ chính chuyên.\nĐể nàng vui thích, vang rèn trống chuông.", "source": "qwen2.5-vl", "crop": "layout/images/dich_tho/page-0042-r013.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Văn dài rau hạnh bên sông.\nKiếm tìm mà hái theo dòng đôi bên.\nĐược người thục nữ chính chuyên.\nMén nàng, cầm sắt đánh lên vang dầy.\nBên sông rau hạnh văn dài,\nĐêm về nấu chín mà bày hai bên.\nĐược người thục nữ chính chuyên.\nĐể nàng vui thích, vang rèn trống chuông.", "truncated": false}}}, {"id": "r014", "layer": "so_trang", "group": "so_trang", "bbox": [587, 2133, 680, 2207], "text": "43", "source": "layout_hint", "crop": "layout/images/so_trang/page-0042-r014.png", "corrected": false, "patch_file": "", "ocr": {}}]}, {"page": 43, "image": "images/page-0043.png", "json": "pages/page-0043.json", "size": [1538, 2246], "regions": [{"id": "r001", "layer": "tieu_de", "group": "tieu_de", "bbox": [505, 147, 1019, 224], "text": "Chú giải của Chu Hy", "source": "source_patch", "crop": "layout/images/tieu_de/page-0043-r001.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "Chú giải của Chu Hy", "truncated": false}}}, {"id": "r002", "layer": "chu_thich", "group": "chu_thich", "bbox": [80, 229, 1435, 614], "text": "Chương này thuộc hứng 采 thể (thái), chọn mà hái, lấy芼 mạo, nấu chín mà dâng lên, 琴 cầm, cây đàn 5 dây hoặc 7 dây, 瑟 sắt, đàn 25 dây, đều là loại đàn dây tơ, loại nhạc khí nhỏ 友 vi (hữu), ý thân ái 鍾 chung, cái chuông, loại nhạc khí bằng đồng 鼓 cổ, cái trống, loại nhạc khí to bằng da 樂 lạc, ý rất thuận hòa vui vẻ.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0043-r002.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này thuộc hứng 采 thể (thái), chọn mà hái, lấy芼 mạo, nấu chín mà dâng lên, 琴 cầm, cây đàn 5 dây hoặc 7 dây, 瑟 sắt, đàn 25 dây, đều là loại đàn dây tơ, loại nhạc khí nhỏ 友 vi (hữu), ý thân ái 鍾 chung, cái chuông, loại nhạc khí bằng đồng 鼓 cổ, cái trống, loại nhạc khí to bằng da 樂 lạc, ý rất thuận hòa vui vẻ.", "truncated": false}}}, {"id": "r003", "layer": "chu_thich", "group": "chu_thich", "bbox": [79, 612, 1436, 1026], "text": "Chương này nói vào lúc tìm được nàng rau hạnh cộng ngắn dài không đều kia, phải chọn hái rồi nấu luộc mà dâng lên. Người thực nữ yêu điệu ấy đã cầu được rồi, phải thân ái để làm cho nàng vui, vì rằng người ấy với đức hạnh ấy trên đời không thường có vậy. Hôm nay mà cầu được nàng, thì đã được người để phối hợp với vua thành việc nội trị. Cho nên tỏ ý vui mừng tôn kính không xiết như thế vậy.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0043-r003.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này nói vào lúc tìm được nàng rau hạnh cộng ngắn dài không đều kia, phải chọn hái rồi nấu luộc mà dâng lên. Người thực nữ yêu điệu ấy đã cầu được rồi, phải thân ái để làm cho nàng vui, vì rằng người ấy với đức hạnh ấy trên đời không thường có vậy. Hôm nay mà cầu được nàng, thì đã được người để phối hợp với vua thành việc nội trị. Cho nên tỏ ý vui mừng tôn kính không xiết như thế vậy.", "truncated": false}}}, {"id": "r004", "layer": "chu_thich", "group": "chu_thich", "bbox": [77, 1018, 1435, 1146], "text": "Thiên Quan thư có 3 chương, 1 chương 4 câu, 2 chương 8 câu.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0043-r004.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Thiên Quan thư có 3 chương, 1 chương 4 câu, 2 chương 8 câu.", "truncated": false}}}, {"id": "r005", "layer": "chu_thich", "group": "chu_thich", "bbox": [81, 1134, 1438, 2006], "text": "Khổng tử nói rằng: \"Thiên Quan thư vui mà không dâm, buồn mà không thương tâm\". Tôi cho rằng: Lời ấy đối với thơ Quan thư này đúng với sự đoan chính của tính tình và sự điêu hoà của thanh khí. Vì rằng đức hạnh như chim thư cưu, tình chí thiết đậm đà mà vẫn giữ gìn cách biệt, thì sự đoan chính về tính tình của bà Hậu phi Thái Tự hản đã có thể nhận thấy được một phần rồi. Đến việc thức ngũ lân qua trở lại, đánh đàn cầm đàn sắt, khua chuông đánh trống, niềm vui buồn đã tột bực và đều không quá khuôn khổ phép tắc, thì sự đoan chính về tính tình của người làm thơ ấy lại có thể nhận thấy được cả toàn thể rồi vậy. Riêng sự điêu hoà về thanh khí thì không thể nghe được. Tuy là đáng hận, nhưng học giả hãy thưởng thức nghĩa lý ở trong lời thơ ấy để bồi dưỡng tâm tính, thì cũng có thể nắm được căn bản của việc học Kinh Thi vậy.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0043-r005.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Khổng tử nói rằng: \"Thiên Quan thư vui mà không dâm, buồn mà không thương tâm\". Tôi cho rằng: Lời ấy đối với thơ Quan thư này đúng với sự đoan chính của tính tình và sự điêu hoà của thanh khí. Vì rằng đức hạnh như chim thư cưu, tình chí thiết đậm đà mà vẫn giữ gìn cách biệt, thì sự đoan chính về tính tình của bà Hậu phi Thái Tự hản đã có thể nhận thấy được một phần rồi. Đến việc thức ngũ lân qua trở lại, đánh đàn cầm đàn sắt, khua chuông đánh trống, niềm vui buồn đã tột bực và đều không quá khuôn khổ phép tắc, thì sự đoan chính về tính tình của người làm thơ ấy lại có thể nhận thấy được cả toàn thể rồi vậy. Riêng sự điêu hoà về thanh khí thì không thể nghe được. Tuy là đáng hận, nhưng học giả hãy thưởng thức nghĩa lý ở trong lời thơ ấy để bồi dưỡng tâm tính, thì cũng có thể nắm được căn bản của việc học Kinh Thi vậy.", "truncated": false}}}, {"id": "r006", "layer": "so_trang", "group": "so_trang", "bbox": [751, 2130, 836, 2196], "text": "44", "source": "layout_hint", "crop": "layout/images/so_trang/page-0043-r006.png", "corrected": false, "patch_file": "", "ocr": {}}]}, {"page": 44, "image": "images/page-0044.png", "json": "pages/page-0044.json", "size": [1538, 2246], "regions": [{"id": "r001", "layer": "chu_thich", "group": "chu_thich", "bbox": [65, 138, 1424, 376], "text": "Khuông Hành nói rằng: Phối hợp thành vợ chồng là mối đầu của việc phồn sinh của dân chúng, là nguồn cội của vạn phúc. Nghi lễ của hôn nhân được chính đáng thì về sau phẩm vật thoả thuận và thiên mệnh mới hoàn toàn.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0044-r001.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Khuông Hành nói rằng: Phối hợp thành vợ chồng là mối đầu của việc phồn sinh của dân chúng, là nguồn cội của vạn phúc. Nghi lễ của hôn nhân được chính đáng thì về sau phẩm vật thoả thuận và thiên mệnh mới hoàn toàn.", "truncated": false}}}, {"id": "r002", "layer": "chu_thich", "group": "chu_thich", "bbox": [65, 372, 1425, 728], "text": "Mạnh tử đã khảo luận Kinh Thi, lấy thiên Quan thư làm đầu, ý nói rằng trên hơn hết là bực cha mẹ dân, đức hạnh của bà Hậu phi phu nhân nếu chẳng ngang bằng trời đất, thì không lấy gì mà thờ phụng thần linh để điều hòa sự thích nghi của vạn vật. Từ đời trước trở lại, việc hưng phế của ba đời Hạ, Thương, Chu chưa có bao giờ không do ở đấy vậy.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0044-r002.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Mạnh tử đã khảo luận Kinh Thi, lấy thiên Quan thư làm đầu, ý nói rằng trên hơn hết là bực cha mẹ dân, đức hạnh của bà Hậu phi phu nhân nếu chẳng ngang bằng trời đất, thì không lấy gì mà thờ phụng thần linh để điều hòa sự thích nghi của vạn vật. Từ đời trước trở lại, việc hưng phế của ba đời Hạ, Thương, Chu chưa có bao giờ không do ở đấy vậy.", "truncated": false}}}, {"id": "r003", "layer": "tieu_de", "group": "tieu_de", "bbox": [572, 770, 915, 864], "text": "BÀI THỨ 2", "source": "source_patch", "crop": "layout/images/tieu_de/page-0044-r003.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "BÀI THỨ 2", "truncated": false}}}, {"id": "r004", "layer": "tieu_de", "group": "tieu_de", "bbox": [603, 936, 888, 1008], "text": "CHƯƠNG I", "source": "source_patch", "crop": "layout/images/tieu_de/page-0044-r004.png", "corrected": de", "bbox": [525, 1514, 1043, 1590], "text": "Chú giải của Chu Hy", "source": "source_patch", "crop": "layout/images/tieu_de/page-0046-r007.png", "corrected": true, "patch_file": "patches/ocr_titles.tsv", "ocr": {"qwen2.5-vl": {"text": "Chú giải của Chu Hy", "truncated": false}}}, {"id": "r008", "layer": "chu_thich", "group": "chu_thich", "bbox": [92, 1605, 1459, 1803], "text": "Chương này thuộc thể phú 莫莫 mích mích, dáng rườm rà chen rậm, 戛 ngải, chặt cắt, 護 hoạch, nấu 綿 si, vải mịn,\n給 khích, vải thô, dịch chán ghét.", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0046-r008.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này thuộc thể phú 莫莫 mích mích, dáng rườm rà chen rậm, 戛 ngải, chặt cắt, 護 hoạch, nấu 綿 si, vải mịn,\n給 khích, vải thô, dịch chán ghét.", "truncated": false}}}, {"id": "r009", "layer": "chu_thich", "group": "chu_thich", "bbox": [91, 1805, 1459, 2044], "text": "Chương này nói vào thời thịnh hạ, giữa mùa hè, cây sắn đã già, nàng mới lo cắt lấy chỉ để dệt vải, rồi mặc vải ấy không chán, vì mình đã bỏ công lao nhọc mới biết rằng thành vải không phải dễ dàng, cho nên lòng hằng thương mến, tuy", "source": "qwen2.5-vl", "crop": "layout/images/chu_thich/page-0046-r009.png", "corrected": false, "patch_file": "", "ocr": {"qwen2.5-vl": {"text": "Chương này nói vào thời thịnh hạ, giữa mùa hè, cây sắn đã già, nàng mới lo cắt lấy chỉ để dệt vải, rồi mặc vải ấy không chán, vì mình đã bỏ công lao nhọc mới biết rằng thành vải không phải dễ dàng, cho nên lòng hằng thương mến, tuy", "truncated": false}}}, {"id": "r010", "layer": "so_trang", "group": "so_trang", "bbox": [639, 2096, 728, 2166], "text": "47", "source": "layout_hint", "crop": "layout/images/so_trang/page-0046-r010.png", "corrected": false, "patch_file": "", "ocr": {}}]}, {"page": 47, "image": "images/page-0047.png", "json": "pages/page-0047.json", "size": [1500, 2246], "regions": [{"id": "r001", "layer": "chu_thich", "group": "chu_thich", "bbox": [147, let current=0,active=null;const hash=new URLSearchParams(location.hash.slice(1));const requested=Number(hash.get("page"));const start=pages.findIndex(p=>p.page===requested);if(start>=0)current=start;

function go(index){if(!pages.length)return;current=Math.max(0,Math.min(pages.length-1,index));active=null;$("query").value="";document.querySelector(".text-panel").scrollTop=0;document.querySelector(".image-panel").scrollTop=0;location.hash="page="+pages[current].page;render()}
$("prev").onclick=()=>go(current-1);$("next").onclick=()=>go(current+1);$("pageSelect").onchange=()=>go(Number($("pageSelect").value));for(const id of ["layerSelect","engineSelect","showHints"])$(id).onchange=render;$("query").oninput=render;$("zoom").oninput=()=>{$("imageWrap").style.width=$("zoom").value+"%"};
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;if(e.key==="ArrowLeft")go(current-1);if(e.key==="ArrowRight")go(current+1)});
if(!pages.length){$("count").textContent="Chưa có dữ liệu trang.";$("prev").disabled=true;$("next").disabled=true}else{render();if(hash.get("region"))focusRegion(hash.get("region"),true)}
</script></body></html>
