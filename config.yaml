# Đường dẫn tương đối với thư mục gốc project.
# Demo baseline đọc manifest.json; OCR Tuần 2 đọc config qua src/ocr_week2_pipeline.py.
group: 1
seed: 42
data_dir: .
manifest: manifest.json

assignments:
  # Phần chính: hoàn thiện corpus v1 trước khi xử lý phần mở rộng.
  - file: "chinh/Kinh Thi - Ta Quang Phát 1 (tr1-346).pdf"
    part: chinh
    source: ocr
  - file: "chinh/Vi Chánh (tr1-330).pdf"
    part: chinh
    source: text
  - file: "chinh/Dao Duc Kinh Han Van.pdf"
    part: chinh
    source: text
  - file: "chinh/Tang Quang Hien.pdf"
    part: chinh
    source: text

  # Phần mở rộng: xử lý ở tuần 5; loại file và page_offset nằm trong manifest.
  - file: "mo_rong/Long Thư Tịnh Độ Văn 龍舒淨土文 (txt Hán Việt).pdf"
    part: mo_rong
    source: text
  - file: "mo_rong/LongThuTinhDo (txt Việt).pdf"
    part: mo_rong
    source: ocr
  - file: "mo_rong/龍舒淨土文.pdf"
    part: mo_rong
    source: ocr
    purpose: ocr_evaluation

# `src/ocr_week2_pipeline.py` đọc phần OCR; pipeline corpus còn được triển khai tiếp.
ocr:
  engines: [paddleocr, got-ocr2, qwen2.5-vl, tesseract]
  vote: char_majority
  tie_break: lowest_cer
  dpi: 300
  sample_pdf: "chinh/Kinh Thi - Ta Quang Phát 1 (tr1-346).pdf"
  # Hiệu chỉnh trên toàn bộ 11 ảnh được cung cấp, tương ứng PDF 38–48.
  evaluation_pages: "38-48"
  tie_break_scope: evaluation_sample
  selected_output: voting
  vote_alignment: star
  vote_engines: [paddleocr, got-ocr2, qwen2.5-vl, tesseract]
  # Mỗi hệ chữ đều có >=3 phiếu; GOT có CER Việt cao nhất nên không bỏ phiếu Việt.
  vote_vietnamese_engines: [paddleocr, qwen2.5-vl, tesseract]
  engine_options:
    paddleocr:
      device: cpu
    got-ocr2:
      device: cuda:0
      profile: scan
      max_new_tokens: 2048
    qwen2.5-vl:
      device: cuda:0
      profile: balanced
      quantization: 4bit
      cpu_offload: true
      max_new_tokens: 512
      max_pixels: 401408
    tesseract:
      device: cpu
      profile: balanced

punctuate:
  model: raynardj/classical-chinese-punctuation-guwen-biaodian

align:
  method: gale_church
  embedding: BAAI/bge-m3
  use_reading_anchors: true

out_dir: out/
